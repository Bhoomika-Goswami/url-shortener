<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem 1rem; color: #1f2933; }
    .card { max-width: 560px; margin: 0 auto 1.5rem; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    form, .row { display: flex; gap: .5rem; }
    input { flex: 1; min-width: 0; padding: .65rem; border: 1px solid #cbd2d9; border-radius: 8px; font-size: 1rem; }
    button { padding: .65rem 1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 1rem; word-break: break-all; }
    .error { color: #b91c1c; }
    .ok a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>URL Shortener</h1>
    <form id="shorten-form">
      <input id="url" type="url" placeholder="https://example.com/very/long/link" required />
      <button id="shorten-btn" type="submit">Shorten</button>
    </form>
    <div id="result" class="msg" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2>Check clicks</h2>
    <form id="stats-form" class="row">
      <input id="code" type="text" placeholder="short code (e.g. aB3xYz9)" required />
      <button type="submit">Check</button>
    </form>
    <div id="stats" class="msg" aria-live="polite"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // textContent use kiya hai (innerHTML nahi) taaki XSS na ho
    function show(el, text, cls) {
      el.className = "msg " + (cls || "");
      el.textContent = text;
    }

    $("shorten-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("shorten-btn");
      btn.disabled = true;
      try {
        const res = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: $("url").value.trim() }),
        });
        const data = await res.json();
        if (!res.ok) return show($("result"), data.error || "Something went wrong", "error");

        const box = $("result");
        box.className = "msg ok";
        box.textContent = "Short URL: ";
        const a = document.createElement("a");
        a.href = data.shortUrl;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = data.shortUrl;
        const copy = document.createElement("button");
        copy.textContent = "Copy";
        copy.style.marginLeft = ".5rem";
        copy.onclick = async () => {
          try { await navigator.clipboard.writeText(data.shortUrl); copy.textContent = "Copied!"; }
          catch { copy.textContent = "Copy failed"; }
        };
        box.append(a, copy);
      } catch {
        show($("result"), "Network error, try again", "error");
      } finally {
        btn.disabled = false;
      }
    });

    $("stats-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = $("code").value.trim().split("/").pop(); // poora short URL paste karo to bhi chalega
      try {
        const res = await fetch("/api/stats/" + encodeURIComponent(code));
        const data = await res.json();
        if (!res.ok) return show($("stats"), data.error || "Not found", "error");
        show($("stats"), `Clicks: ${data.clicks} | Created: ${new Date(data.createdAt).toLocaleString()} | Original: ${data.original}`);
      } catch {
        show($("stats"), "Network error, try again", "error");
      }
    });
  </script>
</body>
</html>
